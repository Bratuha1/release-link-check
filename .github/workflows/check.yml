name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  live-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: ./
        with:
          files: |
            README.md
            docs/ru.md
            tests/published-link.txt
      - name: Create a local release fixture
        shell: bash
        run: |
          mkdir -p "fixture dist"
          touch "fixture dist/PeripheralBatteryTray-1.0.0-windows-x64-portable.zip"
      - uses: ./
        with:
          files: tests/published-link.txt
          local-release: Bratuha1/peripheral-battery-tray@v1.0.0=fixture dist
